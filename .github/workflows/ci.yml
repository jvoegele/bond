name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # Pinned to 22.04: erlef/setup-beam has no prebuilt OTP < 26 for ubuntu-24.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Spans the declared floor (1.16) through the current latest stable (1.20).
      # The Elixir axis is what drives the built-in type checker, so every supported
      # minor runs `mix test` (and thus the type-checker regression guard in
      # test/bond/type_checker_regression_test.exs, which is active from 1.18+).
      # Each pairing is within the minor's supported OTP range (1.18: 25–27, 1.19:
      # 26–28, 1.20: 27–29). 1.16–1.19 pin OTP 27.2 (stable, cached); the 1.20 leg
      # runs OTP 29.0.1 — the toolchain verified locally and the matrix's first
      # OTP-28/29-era coverage.
      matrix:
        include:
          - elixir: "1.16.3"
            otp: "26.2"
          - elixir: "1.17.3"
            otp: "27.2"
          - elixir: "1.18.3"
            otp: "27.2"
          - elixir: "1.19.5"
            otp: "27.2"
          - elixir: "1.20.0"
            otp: "29.0.1"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          # Key includes lib/ source hash so changes to compiler internals
          # invalidate the cache. Without this, a stale _build snapshot can
          # trigger a partial recompile that races: e.g. a doc-chunk-only
          # change to lib/bond/compiler/compile_state_fsm/server.ex forces
          # Server.beam to be rewritten in parallel with the test/support
          # compile, and the user-fixture `use Bond` macro starts the FSM
          # gen_statem while Server is mid-write, producing
          # `module Bond.Compiler.CompileStateFSM.Server is not available`.
          # Cache-busting on lib source avoids that class of failure entirely.
          # The `-v2-` suffix is a one-time invalidation marker; bump on each
          # cache-shape change so old prefix-matching cached `_build`
          # snapshots don't restore-key-fallback into a new build that
          # expects different invariants.
          key: ${{ runner.os }}-mix-v2-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('lib/**/*.ex', '**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-v2-${{ matrix.otp }}-${{ matrix.elixir }}-
      - run: mix deps.get
      - run: mix test

  lint:
    name: Format and library warnings
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.19.5"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      # Compiles the library (dev env, so the deliberately-illustrative
      # test/support fixtures are not in scope) with warnings as errors.
      - run: mix compile --warnings-as-errors

  dialyzer:
    name: Dialyzer (Bond library)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.19.5"
      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          # Source-hash inclusion matches the test job's cache key — see
          # the rationale comment there.
          key: ${{ runner.os }}-dialyzer-build-v2-${{ hashFiles('lib/**/*.ex', '**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-build-v2-
      - name: Cache PLT
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-dialyzer-plt-${{ hashFiles('lib/**/*.ex', '**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-plt-
      - run: mix deps.get
      - run: mix dialyzer --format github

  compile_overhead:
    name: Compile-time overhead guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.19.5"
      - run: mix deps.get
      # Bond adds compile time to every module that uses it, and nothing measured
      # it until #96 — where a change that tripled it reached main while its
      # runtime counterpart was carefully benchmarked. This is the guard.
      #
      # The bound is a *ratio* (Bond-compile time / no-Bond compile time) rather
      # than absolute milliseconds, which are meaningless across machines: this
      # runner takes ~1730 ms for the no-Bond batch where a dev laptop takes
      # ~377 ms.
      #
      # The ratio is NOT portable either, though — it is calibrated to this
      # runner and nothing else. The same commit measures 9.3x here and ~16.6x
      # on an M3 Max, because the two halves do not scale together: Bond's share
      # is macro expansion in Elixir, the baseline's is BEAM compilation, and the
      # runner's slower cores penalise the latter more. So this number cannot be
      # reasoned about from a local run — change it only from an observed CI
      # figure.
      #
      # 14.0 against an observed 9.3x: ~50% headroom for run-to-run noise, while
      # still catching a doubling. A tripwire for a step change, not a target.
      - name: Compile-overhead benchmark
        env:
          BOND_MAX_COMPILE_RATIO: "14.0"
        run: mix run bench/compile_overhead.exs

  downstream:
    name: Downstream consumer (warnings-as-errors + Dialyzer)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: integration/consumer
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.18.3"
      - name: Cache consumer deps and build
        uses: actions/cache@v5
        with:
          path: |
            integration/consumer/deps
            integration/consumer/_build
          key: ${{ runner.os }}-downstream-build-${{ hashFiles('integration/consumer/mix.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-downstream-build-
      # PLT cache is keyed on Bond source so it rebuilds when the library API changes,
      # not just when mix.lock changes. No `restore-keys`: a partial restore would bring
      # back a PLT built against a previous Bond, and dialyxir does NOT re-hash
      # `plt_add_apps` modules (Bond) to detect that — it would report "PLT is up to date"
      # and analyse the consumer against stale Bond specs. On a Bond source change we want
      # a key miss to mean "build a fresh PLT", not "reuse the newest stale one".
      - name: Cache consumer PLT
        uses: actions/cache@v5
        with:
          path: integration/consumer/priv/plts
          key: ${{ runner.os }}-downstream-plt-${{ hashFiles('lib/**/*.ex', 'integration/consumer/mix.lock', 'mix.lock') }}
      - run: mix deps.get
      # Bond is a PATH dependency, so a change to its source does not bump mix.lock and the
      # restored `_build` cache keeps a stale Bond beam. Force-recompile it so the consumer
      # (and the freshly-built PLT) are analysed against the current Bond.
      - run: mix deps.compile bond --force
      # The core of issue #2: prove the code Bond generates into a using module
      # is warning-free and Dialyzer-clean in a real consumer.
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix dialyzer --format github

  # The `downstream` consumer above declares `stream_data`, so it cannot see
  # warnings that only appear when Bond's optional dependency is absent — the
  # default adoption path, and the one issue #76 was about. This job builds a
  # throwaway app that depends on Bond and nothing else, and fails on any
  # warning. The app is generated here rather than checked in because its whole
  # point is that it has no source and no deps of its own.
  no_optional_deps:
    name: Adopter without stream_data (no compile warnings)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: bond
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.18.3"
      - name: Generate an app that depends on Bond alone
        run: |
          mix new adopter
          cat > adopter/mix.exs <<'EOF'
          defmodule Adopter.MixProject do
            use Mix.Project

            def project do
              [app: :adopter, version: "0.1.0", elixir: "~> 1.16", deps: deps()]
            end

            def application, do: [extra_applications: [:logger]]

            # Bond and nothing else -- deliberately no stream_data.
            defp deps, do: [{:bond, path: "../bond"}]
          end
          EOF
      # `--warnings-as-errors` is deliberately NOT used here: it applies to the
      # current project's own compilation, and every warning this job exists to
      # catch comes from Bond, a *dependency* of the generated app. Verified: with
      # the warnings present, `mix compile --warnings-as-errors` still exits 0.
      # Inspecting the compile output is what actually discriminates.
      - name: Compile and fail on any warning
        working-directory: adopter
        run: |
          set -o pipefail
          mix deps.get
          mix compile 2>&1 | tee compile.log
          if grep -q "warning:" compile.log; then
            echo "::error::Compiling Bond without stream_data produced warnings (see the log above)."
            exit 1
          fi
